name: Weirdhost 服务器唤醒

on:
  schedule:
    - cron: '30 0,12 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils fonts-nanum fonts-noto-cjk jq wget curl
          python -m pip install --upgrade pip
          pip install seleniumbase requests aiohttp

      - name: 设置代理 (Mihomo / GLaDOS SS)
        continue-on-error: true
        run: |
          set -e
          ARCH=amd64
          VER=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          echo "[信息] Mihomo 版本: ${VER}"
          wget -qO mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-${ARCH}-${VER}.gz"
          gunzip -c mihomo.gz > mihomo
          chmod +x mihomo

          cat > mihomo-config.yaml << 'EOF'
          mixed-port: 7890
          allow-lan: false
          mode: global
          log-level: info
          proxies:
            - name: JP-Fixed-01
              type: ss
              server: 51d8a73.e1.glados-config.com
              port: 2377
              udp: true
              cipher: chacha20-ietf-poly1305
              password: "t0srmdxrm3xyjnvqz9ewlxb2myq7rjuv"
              plugin: obfs
              plugin-opts:
                mode: tls
                host: 51d8a73.46prnbyjdpgp5ogf6uuci5xawy.fastly.net:295614
          proxy-groups:
            - name: PROXY
              type: select
              proxies:
                - JP-Fixed-01
          rules:
            - MATCH,PROXY
          EOF

          ./mihomo -d . -f mihomo-config.yaml > mihomo.log 2>&1 &
          sleep 4
          echo "IS_PROXY=true" >> $GITHUB_ENV
          echo "PROXY_SERVER=http://127.0.0.1:7890" >> $GITHUB_ENV
          echo "[信息] Mihomo 已启动 -> http://127.0.0.1:7890"
          head -n 30 mihomo.log || true

      - name: 运行唤醒脚本
        env:
          WEIRDHOST_COOKIE: ${{ secrets.WEIRDHOST_COOKIE }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python scripts/wake_weirdhost.py

      - name: 清理
        if: always()
        run: |
          pkill -f mihomo || true
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f mihomo mihomo.gz mihomo-config.yaml mihomo.log sing-box sing-box-config.json sing-box.log || true
