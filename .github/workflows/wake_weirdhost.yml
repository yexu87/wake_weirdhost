name: Weirdhost 服务器唤醒

on:
  schedule:
    - cron: '30 0,12 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 调试 - 打印脚本前几行
        run: |
          echo "===== 当前 commit ====="
          git log -1 --oneline
          echo "===== 脚本前 30 行 ====="
          head -n 30 scripts/wake_weirdhost.py
          echo "===== 环境变量检查（不显示真实值）====="
          if [ -n "$WEIRDHOST_COOKIE" ]; then echo "WEIRDHOST_COOKIE: 已设置"; else echo "WEIRDHOST_COOKIE: 空"; fi
          if [ -n "$SERVER_ID" ]; then echo "SERVER_ID: 已设置 ($SERVER_ID)"; else echo "SERVER_ID: 空"; fi
        env:
          WEIRDHOST_COOKIE: ${{ secrets.WEIRDHOST_COOKIE }}
          SERVER_ID: ${{ secrets.SERVER_ID }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-nanum fonts-noto-cjk

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase aiohttp

      - name: 运行唤醒脚本
        env:
          WEIRDHOST_COOKIE: ${{ secrets.WEIRDHOST_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python scripts/wake_weirdhost.py
